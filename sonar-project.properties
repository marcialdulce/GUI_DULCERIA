sonar.projectKey=dulceria-mvc

sonar.projectName=Dulceria MVC
sonar.projectVersion=1.0

# Analiza toda la carpeta actual 
sonar.sources=.

# Analzar los archivos con extensión .sql
sonar.sql.file.suffixes=.sql

# Exclusiones para evitar que analice carpetas de configuración 
sonar.exclusions=**/__pycache__/**, **/.github/**, **/.vscode/**, **/.scannerwork/**
sonar.sourceEncoding=UTF-8
