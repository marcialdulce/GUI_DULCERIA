[project]
name = "dulceria-algorrico"
version = "1.0.0"
description = "Caja Movil - Dulceria Algorrico"
requires-python = ">=3.9"
dependencies = [
    "flet==1.1.3",
    "bcrypt==5.0.0",
    "mysql-connector-python==26.10.0",
    "python-dotenv==1.2.4",
    "reportlab==5.0.1",
]

[tool.flet]
org = "com.algorrico"
product = "Dulceria Algorrico"
company = "Dulceria Algorrico"
copyright = "Copyright (C) 2026 Dulceria Algorrico"

[tool.flet.app]
path = "."
module = "app_movil"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true